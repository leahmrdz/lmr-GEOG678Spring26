<!DOCTYPE html>
<html>
  <head>
    <title>Tutorial 1</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
   integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
   crossorigin=""/>
    <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>
    <!-- Define map height-->
     <style>#map { height: 180px; }</style>
  </head>

  <body>
    <!-- A div for where the map will be -->
    <div id="map"></div>
    <!-- OpenStreetMap Tiles and set coordinates-->
    <script>main();
     function main() {
      var map = L.map('map').setView([51.505, -0.09], 13);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    //Add a marker//
    var marker = L.marker([51.5, -0.09]).addTo(map);
    //Add a circle, also need to define radius//
    var circle = L.circle([51.508, -0.11], {
    color: 'red',
    fillColor: '#f03',
    fillOpacity: 0.5,
    radius: 500
    }).addTo(map);
    //Add a polygon//
    var polygon = L.polygon([
    [51.509, -0.08],
    [51.503, -0.06],
    [51.51, -0.047]
    ]).addTo(map);

    //Working with popups//
    //bind popups to established shapes//
    marker.bindPopup("<b>Hello world!</b><br>I am a popup.").openPopup();
    circle.bindPopup("I am a circle.");
    polygon.bindPopup("I am a polygon.");
    // Use a popup as a layer//
    var popup = L.popup()
    .setLatLng([51.513, -0.09])
    .setContent("I am a standalone popup.")
    .openOn(map);
    //An event: reacting to user interation//
    //function onMapClick(e) {
    //alert("You clicked the map at " + e.latlng);}
    //map.on('click', onMapClick);
    
    //Improve the example:use  a pop instead of an alert//
    var popup = L.popup();
    function onMapClick(e) {
        popup
         .setLatLng(e.latlng)
         .setContent("You clicked the map at " + e.latlng.toString())
         .openOn(map);}
    map.on('click', onMapClick);

    //Geolocation: overrriding the setView method//
    map.locate({setView: true, maxZoom: 16});

        }
    </script>
  </body>
</html>
