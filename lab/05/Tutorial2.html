<!-- learn how to code leaflet for mobile devices -->

<!DOCTYPE html>
<html>
  <head>
    <title>Tutorial 2</title>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
   integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
   crossorigin=""/>
    <!-- Define CSS-->
     <style>body {
    padding: 0;
    margin: 0;}
    html, body, #map {
    height: 100%;
    width: 100vw;}</style>
    <!-- Disable unwanted scaling of page -->
     <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
     <!-- Make sure you put this AFTER Leaflet's CSS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
     integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
     crossorigin=""></script>

  </head>

  <body>
    <!-- A div for where the map will be -->
    <div id="map"></div>
    <!-- OpenStreetMap Tiles and set coordinates-->
    <script>t2();
     function t2() {
      var map = L.map('map').fitWorld();

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
         maxZoom: 19,
          attribution: '© OpenStreetMap'}).addTo(map);
//Geolocation: overrriding the setView method//
     map.locate({setView: true, maxZoom: 16});
     // tell the user about the location that was detected//
     function onLocationFound(e) {
    var radius = e.accuracy;

    L.marker(e.latlng).addTo(map)
        .bindPopup("You are within " + radius + " meters from this point").openPopup();

    L.circle(e.latlng, radius).addTo(map);}
    map.on('locationfound', onLocationFound);

    //show an error message if the gelocation fails//
    function onLocationError(e) {
    alert(e.message);}
    map.on('locationerror', onLocationError);
    }</script>
  </body>
</html
