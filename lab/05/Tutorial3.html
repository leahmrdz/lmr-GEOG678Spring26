     <style>#map { height: 180px; }</style>

  <body>
    <!-- A div for where the map will be -->
    <div id="map"></div>
    <!-- OpenStreetMap Tiles and set coordinates-->
    <script>main();
     function main() {
      var map = L.map('map').setView([51.505, -0.09], 13);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    }).addTo(map);
    //Geolocation: overrriding the setView method//
    map.locate({setView: true, maxZoom: 16});

    //var greenIcon = L.icon({

//PERSONAL ICON FIX///
    const customIcon = L.divIcon({
        html: `<svg xmlns="http://www.w3.org/2000/svg" height="60px" viewBox="0 -960 960 960" width="24px" fill="#8B1A10">
        <path d="m606-286-33-144 111-96-146-13-58-136v312l126 77ZM233-120l65-281L80-590l288-25 112-265 112 265 288 25-218 189 65 281-247-149-247 149Z"/>
        </svg>
        `,
        className: ' ',
        iconSize:     [38, 95], // size of the icon
        iconAnchor:   [22, 94], // point of the icon which will correspond to marker's location
    })

// use the icon as a marker ///
    L.marker([51.5, -0.09], {icon: customIcon}).addTo(map);
