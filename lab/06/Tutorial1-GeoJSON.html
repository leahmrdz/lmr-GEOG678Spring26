<!-- GEOG 678 Lab 6 Tutorial 1 -->

<!DOCTYPE html>
<html>
  <head>
    <title>Lab 6 Tutorial 1</title>
	
	<!-- Leaflet CSS file -->
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.3.1/dist/leaflet.css"
   integrity="sha512-Rksm5RenBEKSKFjgI3a41vrjkw4EVPlJ3+OiI65vTjIdo9brlAacEuKOiQ5OFh7cOI1bkDwLqdLw3Zg0cRJAAQ=="
   crossorigin=""/>
   
   <style>
    #mapid {
    height: 600px;
    width: 800px;
  }
   </style>
   
   
   
  </head>
  <body>
  
     <div id="mapid"></div>
  
  <!-- Leaflet JavaScript file; Make sure you put this AFTER Leaflet's CSS -->
	<script src="https://unpkg.com/leaflet@1.3.1/dist/leaflet.js"
   integrity="sha512-/Nsx9X4HebavoBvEBuyp3I7od5tA0UzAxs+j83KgC8PU0kgB4XiK4Lfe4y4cgBtaRJQEIFCW+oC506aPT2L1zw=="
   crossorigin=""></script>

   
   <script>
   // set map view//
   
   var map = L.map('mapid').setView([39.74739, -106], 4);
   
   L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
    maxZoom: 19
	}).addTo(map);
	
	// onEachFeature - common to use this option to attach a popup//
	function onEachFeature(feature, layer) {
    // does this feature have a property named popupContent?
    if (feature.properties && feature.properties.popupContent) {
        layer.bindPopup(feature.properties.popupContent);
    }
	}

	var geojsonFeature = {
    "type": "Feature",
    "properties": {
        "name": "Coors Field",
        "amenity": "Baseball Stadium",
        "popupContent": "This is where the Rockies play!"
    },
    "geometry": {
        "type": "Point",
        "coordinates": [-104.99404, 39.75621]
    }
		};

	L.geoJSON(geojsonFeature, {
    onEachFeature: onEachFeature
	}).addTo(map);
	
	// adding objects with a GeoJSON layer - comes after oject is defined//
	//L.geoJSON(geojsonFeature).addTo(map);
	
	var myLines = [{
    "type": "LineString",
    "coordinates": [[-100, 40], [-105, 45], [-110, 55]]
	}, {
    "type": "LineString",
    "coordinates": [[-105, 40], [-110, 45], [-115, 55]]
	}];
	
	// create an empty GeoJSON layer so more layers can be added layers//
	var myLayer = L.geoJSON().addTo(map);
	myLayer.addData(geojsonFeature);
	
	var myPolys = [{
    "type": "Feature",
    "properties": {"party": "Republican"},
    "geometry": {
        "type": "Polygon",
        "coordinates": [[
            [-104.05, 48.99],
            [-97.22,  48.98],
            [-96.58,  45.94],
            [-104.03, 45.94],
            [-104.05, 48.99]
        ]]
    }
	}, {
    "type": "Feature",
    "properties": {"party": "Democrat"},
    "geometry": {
        "type": "Polygon",
        "coordinates": [[
            [-109.05, 41.00],
            [-102.06, 40.99],
            [-102.03, 36.99],
            [-109.04, 36.99],
            [-109.05, 41.00]
        ]]
    }
	}];
	
	// polygon styling//
	L.geoJSON(myPolys, {
    style: function(feature) {
        switch (feature.properties.party) {
            case 'Republican': return {color: "#ff0000"};
            case 'Democrat':   return {color: "#0000ff"};
        }
    }
	}).addTo(map);

	// adding objects with a GeoJSON layer //
	L.geoJSON(myLines).addTo(map);
	L.geoJSON(myPolys).addTo(map);
	
	//adding style - styles lines//
	var myStyle = {
    "color": "#ff7800",
    "weight": 5,
    "opacity": 0.65
	};

	L.geoJSON(myLines, {
    style: myStyle
	}).addTo(map);
	
	// pointToLayer option to create a Circle Marker//
	var geojsonMarkerOptions = {
    radius: 8,
    fillColor: "#ff7800",
    color: "#000",
    weight: 1,
    opacity: 1,
    fillOpacity: 0.8
	};

	// will help to display circle marker //
	L.geoJSON(geojsonFeature, {
    pointToLayer: function (feature, latlng) {
       return L.circleMarker(latlng, geojsonMarkerOptions);
    }
	}).addTo(map);


	// using filter option - will not show "Busch Field"//
	var someFeatures = [{
    "type": "Feature",
    "properties": {
        "name": "Coors Field",
        "show_on_map": true
    },
    "geometry": {
        "type": "Point",
        "coordinates": [-104.99404, 39.75621]
    }
	}, {
    "type": "Feature",
    "properties": {
        "name": "Busch Field",
        "show_on_map": false
    },
    "geometry": {
        "type": "Point",
        "coordinates": [-104.98404, 39.74621]
    }
	}];

	L.geoJSON(someFeatures, {
    filter: function(feature, layer) {
        return feature.properties.show_on_map;
    }
	}).addTo(map);

   </script>
  </body>
</html>
